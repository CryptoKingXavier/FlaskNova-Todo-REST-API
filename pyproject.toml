[project]
name = "flasknova"
version = "0.1.0"
description = "FlaskNova Todo REST API — Capability Test"
authors = [
    { name = "cryptokingxavier", email = "azunobicaleb@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "cryptography>=50.0.2",
    "flask-nova>=0.2.1",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "snoop>=0.6.1",
]

[project.scripts]
flasknova = "flasknova.app:main"
listroute = "flasknova.routes:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
